<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal Beauty Assistant</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <header class="site-header">
        <img
          src="img/loreal-logo.png"
          alt="L'Oréal logo"
          class="site-logo"
        />
        <h1 class="site-title">Beauty Assistant</h1>
      </header>

      <main>
        <section class="chatbox">
          <div
            id="latestQuestion"
            class="latest-question"
            aria-live="polite"
          ></div>

          <div id="chatWindow" class="chat-window" aria-live="polite">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask about L'Oréal products, routines, or beauty tips…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn">Send</button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
